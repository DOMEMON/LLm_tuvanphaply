[project]
name = "hcc-g5-source-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.2.0",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
