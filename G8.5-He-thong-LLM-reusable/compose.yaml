name: public-g85-tabular
services:
  workspace:
    build: .
    environment:
      G85_MODEL_URL: ${G85_MODEL_URL:-http://host.docker.internal:18085/v1}
      G85_MODEL_NAME: ${G85_MODEL_NAME:-G85-Tabular-Qwen3-8B-Q4}
      G85_DATA_DIR: /app/.runtime/g85-tabular-service/datasets
      G85_TABULAR_QUERY_ENGINE: g85_package
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    ports: ['127.0.0.1:${G85_PORT:-13085}:8086']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - datasets:/app/.runtime/g85-tabular-service/datasets
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8086/health")']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
volumes:
  datasets:
